<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WealthOS — Quản lý gia sản cá nhân</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
 tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','system-ui']},colors:{ink:'#102a43',mint:'#d9f7ef',teal:'#0f766e',coral:'#ef786f'}}}};
</script>
<style>
 @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap');
 *{box-sizing:border-box} body{font-family:'Be Vietnam Pro',sans-serif;background:#f5f8fa;color:#16324f} .app{min-height:100vh}
 .sidebar{background:#102a43;color:#cbd8e5}.brand{color:#fff}.nav-item{transition:.2s}.nav-item:hover,.nav-item.active{background:#1d4460;color:#fff}.nav-item.active{box-shadow:inset 3px 0 #59d4b5}
 .card{background:#fff;border:1px solid #e7eef2;border-radius:18px;box-shadow:0 8px 24px rgba(16,42,67,.045)} .metric{border-left:4px solid #59d4b5}.muted{color:#6b8093}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;transition:.2s}.btn-primary{background:#0f766e;color:#fff}.btn-primary:hover{background:#0b5e58;transform:translateY(-1px)} .btn-ghost{background:#edf6f4;color:#0f766e}.btn-danger{background:#fff0ef;color:#b54d47}
 input,select,textarea{width:100%;border:1px solid #dbe6eb;border-radius:10px;padding:11px 12px;outline:none;background:#fff;color:#16324f} input:focus,select:focus,textarea:focus{border-color:#47bca4;box-shadow:0 0 0 3px #d9f7ef} label{font-size:12px;font-weight:700;color:#61788b;display:block;margin-bottom:6px}
 .step{display:flex;align-items:center;gap:8px;color:#90a3b2;font-size:12px;font-weight:700}.step-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eaf0f3}.step.done,.step.current{color:#0f766e}.step.done .step-dot,.step.current .step-dot{background:#0f766e;color:#fff}.step-line{height:1px;background:#dbe6eb;flex:1;min-width:18px}.tag{border-radius:99px;padding:5px 10px;font-size:11px;font-weight:700}.good{background:#d9f7ef;color:#0f766e}.warn{background:#fff3d8;color:#9a6a12}.bad{background:#ffe4e1;color:#b54d47}
 .bar{height:9px;background:#edf2f4;border-radius:99px;overflow:hidden}.bar>span{display:block;height:100%;border-radius:99px;background:#47bca4}.bar.orange>span{background:#f1b657}.bar.red>span{background:#ef786f}
 .asset-row{display:grid;grid-template-columns:1fr 140px 100px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid #eef3f5}.asset-row:last-child{border-bottom:0}.section-title{font-size:13px;font-weight:800;color:#16324f;text-transform:uppercase;letter-spacing:.04em}
 .quiz-option{transition:all .2s;border:2px solid #e7eef2;border-radius:14px;padding:14px 16px;cursor:pointer;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px}.quiz-option:hover{border-color:#47bca4;background:#f8fffe}.quiz-option.selected{border-color:#0f766e;background:#d9f7ef}.quiz-option input[type=radio]{margin-top:3px;accent-color:#0f766e}
 .quiz-progress{height:6px;background:#edf2f4;border-radius:99px;overflow:hidden;margin-bottom:20px}.quiz-progress>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#47bca4,#0f766e);transition:width .3s}
 .advice-card{background:#f8fffe;border:1px solid #d9f7ef;border-radius:14px;padding:16px;margin-bottom:12px}.advice-card.warning{background:#fffbf0;border-color:#f5e6c8}.advice-card.danger{background:#fff5f4;border-color:#fdd}
 .compare-bar{display:flex;align-items:center;gap:8px;margin:6px 0}.compare-bar .actual{height:8px;border-radius:4px;background:#47bca4}.compare-bar .target{height:8px;border-radius:4px;background:#e7eef2;border:1px dashed #90a3b2}
 @media(max-width:900px){.sidebar{display:none}.main{width:100%!important}.asset-row{grid-template-columns:1fr 120px 82px}.desktop-only{display:none!important}} @media(max-width:600px){.asset-row{grid-template-columns:1fr 110px}.asset-row .pct{display:none}.grid-mobile{grid-template-columns:1fr!important}.header-title{font-size:22px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const assetGroups=[
 {id:'liquid',title:'Thanh khoản & Tiêu dùng',color:'#47bca4',items:[['cash','Tiền mặt'],['bank','Tiền gửi ngân hàng']]},
 {id:'protect',title:'Tích lũy & Bảo vệ',color:'#6f91e8',items:[['saving','Tiền gửi tiết kiệm'],['gold','Vàng'],['silver','Bạc'],['fx','Ngoại tệ'],['life','Hợp đồng bảo hiểm nhân thọ']]},
 {id:'growth',title:'Đầu tư & Tăng trưởng',color:'#f1b657',items:[['fund','Chứng chỉ quỹ'],['bond','Trái phiếu'],['stock','Cổ phiếu'],['property','Bất động sản']]},
 {id:'risk',title:'Mạo hiểm',color:'#ef786f',items:[['crypto','Crypto']]},
 {id:'receivable',title:'Nợ phải đòi',color:'#a78bfa',items:[['lendPersonal','Cho vay/mượn cá nhân'],['lendOther','Nợ phải thu khác']]}
];
const debtGroups=[
 {id:'consumer',title:'Nợ tiêu dùng & Thẻ tín dụng',color:'#ef786f',items:[['cardDebt','Dư nợ thẻ tín dụng'],['installment','Mua trả góp'],['appLoan','Vay qua app'],['financeLoan','Vay tín chấp công ty tài chính']]},
 {id:'secured',title:'Nợ thế chấp & Hình thành tài sản',color:'#f1b657',items:[['homeLoan','Vay mua nhà'],['carLoan','Vay mua ô tô'],['businessLoan','Vay vốn kinh doanh']]},
 {id:'personal',title:'Nợ cá nhân',color:'#6f91e8',items:[['personalLoan','Vay mượn cá nhân']]}
];

const quizQuestions=[
 {q:'Bạn bè thân nhất sẽ mô tả bạn là người như thế nào về việc chấp nhận rủi ro?',opts:['Thích mạo hiểm','Sẵn sàng chấp nhận rủi ro sau khi nghiên cứu kỹ','Thận trọng','Rất ngại rủi ro'],scores:[4,3,2,1]},
 {q:'Bạn tham gia một gameshow và được chọn một trong các phần thưởng sau. Bạn chọn gì?',opts:['Chắc chắn nhận 10 triệu đồng','50% cơ hội nhận 50 triệu đồng','25% cơ hội nhận 100 triệu đồng','5% cơ hội nhận 1 tỷ đồng'],scores:[1,2,3,4]},
 {q:'Bạn vừa tiết kiệm đủ tiền cho kỳ nghỉ mơ ước. 3 tuần trước khi đi, bạn bị mất việc. Bạn sẽ:',opts:['Hủy kỳ nghỉ','Đi một chuyến tiết kiệm hơn nhiều','Vẫn đi theo kế hoạch, vì cần thời gian chuẩn bị tìm việc mới','Kéo dài kỳ nghỉ, vì đây có thể là cơ hội cuối cùng'],scores:[1,2,3,4]},
 {q:'Nếu bất ngờ nhận được 200 triệu đồng để đầu tư, bạn sẽ làm gì?',opts:['Gửi tiết kiệm ngân hàng hoặc mua chứng chỉ tiền gửi','Đầu tư vào trái phiếu chất lượng cao hoặc quỹ trái phiếu','Đầu tư vào cổ phiếu hoặc quỹ cổ phiếu'],scores:[1,2,3]},
 {q:'Về kinh nghiệm, bạn cảm thấy thoải mái thế nào khi đầu tư cổ phiếu hoặc quỹ cổ phiếu?',opts:['Hoàn toàn không thoải mái','Tương đối thoải mái','Rất thoải mái'],scores:[1,2,3]},
 {q:'Khi nghĩ đến từ "rủi ro", từ nào xuất hiện đầu tiên trong đầu bạn?',opts:['Mất mát','Không chắc chắn','Cơ hội','Hồi hộp/Phấn khích'],scores:[1,2,3,4]},
 {q:'Chuyên gia dự đoán vàng và bất động sản sẽ tăng giá; trái phiếu có thể giảm. Phần lớn tài sản của bạn đang ở trái phiếu chính phủ lãi cao. Bạn sẽ:',opts:['Giữ nguyên trái phiếu','Bán 50% trái phiếu, chuyển sang vàng/BĐS','Bán toàn bộ trái phiếu, chuyển sang vàng/BĐS','Bán hết và vay thêm để mua vàng/BĐS'],scores:[1,2,3,4]},
 {q:'Với các kịch bản đầu tư sau (lãi tốt nhất / lỗ xấu nhất), bạn chọn phương án nào?',opts:['Lãi tối đa 2 triệu / Không lỗ','Lãi tối đa 8 triệu / Lỗ tối đa 2 triệu','Lãi tối đa 26 triệu / Lỗ tối đa 8 triệu','Lãi tối đa 48 triệu / Lỗ tối đa 24 triệu'],scores:[1,2,3,4]},
 {q:'Ngoài những gì bạn đang có, bạn được tặng thêm 100 triệu. Bạn phải chọn:',opts:['Chắc chắn nhận thêm 50 triệu','50% cơ hội nhận thêm 100 triệu, 50% không nhận gì'],scores:[1,3]},
 {q:'Ngoài những gì bạn đang có, bạn được tặng 200 triệu. Bạn phải chọn:',opts:['Chắc chắn mất 50 triệu','50% cơ hội mất 100 triệu, 50% không mất gì'],scores:[1,3]},
 {q:'Giả sử được thừa kế 1 tỷ đồng và BẮT BUỘC phải đầu tư toàn bộ vào MỘT lựa chọn. Bạn chọn:',opts:['Tiết kiệm ngân hàng hoặc quỹ thị trường tiền tệ','Quỹ cân bằng (cổ phiếu + trái phiếu)','Danh mục 15 cổ phiếu riêng lẻ','Hàng hóa: vàng, bạc, dầu, crypto'],scores:[1,2,3,4]},
 {q:'Nếu phải đầu tư 200 triệu, phương án phân bổ nào hấp dẫn bạn nhất?',opts:['60% rủi ro thấp, 30% trung bình, 10% rủi ro cao','30% rủi ro thấp, 40% trung bình, 30% rủi ro cao','10% rủi ro thấp, 40% trung bình, 50% rủi ro cao'],scores:[1,2,3]},
 {q:'Một người bạn tin cậy mời bạn góp vốn vào dự án có thể lãi 50-100 lần, nhưng xác suất thành công chỉ 20%. Nếu thất bại, mất toàn bộ. Bạn sẽ đầu tư bao nhiêu?',opts:['Không đầu tư','1 tháng thu nhập','3 tháng thu nhập','6 tháng thu nhập'],scores:[1,2,3,4]}
];

// Allocation targets per profile: [safe%, medium%, growth%]
// safe = liquid + protect (excl life insurance for growth calc) 
// medium = bond + fund + property
// growth = stock + crypto
function getQuizCategory(score){
 if(score<=18) return {label:'Rất thận trọng',color:'#6f91e8',desc:'Bạn ưu tiên bảo toàn vốn tuyệt đối.',alloc:[80,15,5],allocText:'80% an toàn – 15% trung bình – 5% tăng trưởng cao'};
 if(score<=22) return {label:'Thận trọng',color:'#47bca4',desc:'Bạn chấp nhận rủi ro nhỏ để đạt lợi nhuận cao hơn lạm phát.',alloc:[60,30,10],allocText:'60% an toàn – 30% trung bình – 10% tăng trưởng cao'};
 if(score<=28) return {label:'Cân bằng',color:'#f1b657',desc:'Bạn tìm kiếm sự cân đối giữa tăng trưởng và bảo toàn.',alloc:[40,35,25],allocText:'40% an toàn – 35% trung bình – 25% tăng trưởng cao'};
 if(score<=32) return {label:'Năng động',color:'#ef786f',desc:'Bạn sẵn sàng chịu biến động để theo đuổi lợi nhuận cao.',alloc:[20,30,50],allocText:'20% an toàn – 30% trung bình – 50% tăng trưởng cao'};
 return {label:'Mạo hiểm',color:'#b54d47',desc:'Bạn chấp nhận rủi ro rất cao để tối đa hóa lợi nhuận.',alloc:[10,20,70],allocText:'10% an toàn – 20% trung bình – 70% tăng trưởng cao'};
}

const defaultData={profile:{goal:'Tự do tài chính',age:30,targetAge:45,quizAnswers:Array(13).fill(-1),quizScore:null},cashflow:{income:[0,0,0],expense:[0,0,0]},assets:{},debts:{}};
let data=JSON.parse(localStorage.getItem('wealthOSData')||'null')||defaultData;
if(data.profile.quizAnswers===undefined){data.profile.quizAnswers=Array(13).fill(-1);data.profile.quizScore=null;}
let step=0; let charts={}; let quizPage=0;
const vnd=n=>new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(Number(n)||0);
const compact=n=>{n=Number(n)||0;if(n>=1e9)return (n/1e9).toFixed(1)+' tỷ';if(n>=1e6)return (n/1e6).toFixed(1)+' tr';return vnd(n)};
const sum=o=>Object.values(o||{}).reduce((a,b)=>a+(Number(b)||0),0);
function save(){localStorage.setItem('wealthOSData',JSON.stringify(data));toast('Đã lưu dữ liệu vào trình duyệt');render()}
function toast(t){let e=document.getElementById('toast');if(!e)return;e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}
function pct(a,b){return b?Math.round(a/b*100):0}
function inputNumber(kind,key,val){data[kind][key]=Math.max(0,Number(val)||0);localStorage.setItem('wealthOSData',JSON.stringify(data));render(false)}

// Core financial calculations
function getAssetBreakdown(){
 let d=data.assets;
 let safe=(Number(d.cash)||0)+(Number(d.bank)||0)+(Number(d.saving)||0)+(Number(d.gold)||0)+(Number(d.silver)||0)+(Number(d.fx)||0)+(Number(d.life)||0);
 let medium=(Number(d.fund)||0)+(Number(d.bond)||0)+(Number(d.property)||0);
 let growth=(Number(d.stock)||0)+(Number(d.crypto)||0);
 let receivable=(Number(d.lendPersonal)||0)+(Number(d.lendOther)||0);
 let total=safe+medium+growth+receivable;
 // For allocation comparison, exclude receivables (not investable)
 let investable=safe+medium+growth;
 return {safe,medium,growth,receivable,total,investable};
}
function getEmergencyFund(){
 let d=data.assets;
 // Emergency fund = highly liquid assets: cash + bank deposits + savings
 let fund=(Number(d.cash)||0)+(Number(d.bank)||0)+(Number(d.saving)||0);
 let monthlyExpense=sum(data.cashflow.expense)/3;
 let months=monthlyExpense>0?fund/monthlyExpense:0;
 let target=monthlyExpense*6; // 6 months target
 let shortfall=Math.max(0,monthlyExpense*3-fund); // minimum 3 months
 return {fund,monthlyExpense,months,target,shortfall};
}
function totals(){
 let ab=getAssetBreakdown();
 return {assets:ab.total,debts:sum(data.debts),net:ab.total-sum(data.debts),income:sum(data.cashflow.income)/3,expense:sum(data.cashflow.expense)/3};
}
function quizResult(){
 let score=data.profile.quizScore;
 if(score===null||score===undefined) return null;
 return getQuizCategory(score);
}
function calcQuizScore(){
 let total=0, answered=0;
 for(let i=0;i<13;i++){let a=data.profile.quizAnswers[i];if(a>=0){total+=quizQuestions[i].scores[a];answered++;}}
 if(answered===13){data.profile.quizScore=total;localStorage.setItem('wealthOSData',JSON.stringify(data));}
 return answered===13?total:null;
}
function analysis(){
 let t=totals(),ab=getAssetBreakdown(),ef=getEmergencyFund();
 let savings=t.income-t.expense;
 let debtRatio=t.assets?sum(data.debts)/t.assets:0;
 return {t,ab,ef,savings,debtRatio};
}

function chart(id,type,labels,values,colors){let ctx=document.getElementById(id);if(!ctx)return;if(charts[id])charts[id].destroy();charts[id]=new Chart(ctx,{type,data:{labels,datasets:[{data:values,backgroundColor:colors,borderWidth:0,borderRadius:type==='bar'?6:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:type!=='bar',position:'bottom',labels:{font:{family:'Be Vietnam Pro',size:11},usePointStyle:true,padding:14}}},scales:type==='bar'?{x:{grid:{display:false},ticks:{font:{family:'Be Vietnam Pro',size:10}}},y:{grid:{color:'#edf2f4'},ticks:{callback:v=>compact(v),font:{family:'Be Vietnam Pro',size:10}}}}:{}}});}

function nav(){return `<aside class="sidebar w-64 shrink-0 min-h-screen p-5 fixed left-0 top-0"><div class="brand flex items-center gap-3 text-lg font-extrabold mb-10"><div class="w-10 h-10 rounded-xl bg-teal-400 grid place-items-center text-slate-900">W</div> WealthOS</div><div class="text-[10px] uppercase tracking-widest text-slate-400 mb-3">Không gian của bạn</div><div class="space-y-1">${[['dashboard','Tổng quan','▦'],['profile','Mục tiêu & Tính cách','◎'],['cashflow','Thu & Chi','↕'],['assets','Tài sản','◈'],['debts','Khoản nợ','⌁'],['insights','Phân tích & Gợi ý','✦']].map((x,i)=>`<button onclick="go(${i})" class="nav-item ${step===i?'active':''} w-full text-left rounded-xl px-3 py-3 flex gap-3 items-center text-sm"><span class="text-lg w-5">${x[2]}</span>${x[1]}</button>`).join('')}</div><div class="absolute bottom-5 left-5 right-5 text-xs text-slate-400 leading-5">Dữ liệu chỉ lưu trên thiết bị của bạn.<br><button onclick="resetData()" class="underline mt-2">Xóa toàn bộ dữ liệu</button></div></aside>`}
function header(title,sub){return `<header class="flex justify-between items-start gap-4 mb-7"><div><div class="text-xs text-teal-700 font-bold mb-2">WEALTHOS / CÁ NHÂN</div><h1 class="header-title text-3xl font-extrabold tracking-tight">${title}</h1><p class="muted text-sm mt-2">${sub}</p></div><button onclick="save()" class="btn btn-primary hidden sm:block">Lưu thay đổi</button></header>`}
function metric(label,value,sub,cls=''){return `<div class="card metric p-5 ${cls}"><div class="muted text-xs font-semibold">${label}</div><div class="font-extrabold text-xl mt-2">${value}</div><div class="text-xs muted mt-2">${sub}</div></div>`}

// ===== DASHBOARD =====
function dashboard(){
 let a=analysis(), allocation=assetGroups.map(g=>[g.title,g.items.reduce((s,x)=>s+(Number(data.assets[x[0]])||0),0),g.color]).filter(x=>x[1]>0);
 let qr=quizResult();
 let ef=a.ef;
 
 // Emergency fund explanation
 let efExplain=`<div class="bg-slate-50 rounded-xl p-4 mt-4"><div class="text-xs font-bold muted mb-2">QUỸ DỰ PHÒNG KHẨN CẤP</div><p class="text-xs muted mb-2">= Tiền mặt (${compact(Number(data.assets.cash)||0)}) + Tiền gửi NH (${compact(Number(data.assets.bank)||0)}) + Tiết kiệm (${compact(Number(data.assets.saving)||0)}) = <b class="text-ink">${compact(ef.fund)}</b></p><p class="text-xs muted">÷ Chi tiêu TB/tháng (${compact(ef.monthlyExpense)}) = <b class="text-ink">${ef.months.toFixed(1)} tháng</b> sinh hoạt</p>${ef.shortfall>0?`<p class="text-xs mt-2" style="color:#9a6a12"><b>⚠ Thiếu ${compact(ef.shortfall)}</b> để đạt mức tối thiểu 3 tháng</p>`:`<p class="text-xs mt-2 text-teal-700"><b>✓ Đạt mức an toàn tối thiểu 3 tháng</b></p>`}</div>`;

 // Risk profile comparison on dashboard
 let riskCompare='';
 if(qr && a.ab.investable>0){
  let actualSafe=Math.round(a.ab.safe/a.ab.investable*100);
  let actualMed=Math.round(a.ab.medium/a.ab.investable*100);
  let actualGrowth=Math.round(a.ab.growth/a.ab.investable*100);
  let [tSafe,tMed,tGrowth]=qr.alloc;
  riskCompare=`<div class="card p-5 mt-5"><div class="flex justify-between items-center mb-3"><h2 class="font-extrabold">Đối chiếu phân bổ vs Hồ sơ rủi ro "${qr.label}"</h2><span class="tag" style="background:${qr.color}20;color:${qr.color}">${data.profile.quizScore}/47 điểm</span></div><div class="space-y-4"><div><div class="flex justify-between text-xs mb-1"><span>An toàn (tiền mặt, tiết kiệm, vàng, BH...)</span><span><b>${actualSafe}%</b> thực tế vs <b>${tSafe}%</b> khuyến nghị</span></div><div class="h-2 rounded bg-gray-100 relative"><div class="h-2 rounded absolute top-0 left-0" style="width:${actualSafe}%;background:${actualSafe>tSafe+10?'#f1b657':actualSafe<tSafe-10?'#ef786f':'#47bca4'}"></div><div class="absolute top-0 h-2 w-0.5 bg-ink" style="left:${tSafe}%"></div></div><p class="text-[11px] muted mt-1">${actualSafe>tSafe+10?'↑ Đang thừa '+(actualSafe-tSafe)+'% so với khuyến nghị — có thể chuyển bớt sang nhóm tăng trưởng':actualSafe<tSafe-10?'↓ Đang thiếu '+(tSafe-actualSafe)+'% — cần tăng cường tài sản an toàn':'✓ Phù hợp với hồ sơ rủi ro'}</p></div><div><div class="flex justify-between text-xs mb-1"><span>Trung bình (quỹ, trái phiếu, BĐS)</span><span><b>${actualMed}%</b> thực tế vs <b>${tMed}%</b> khuyến nghị</span></div><div class="h-2 rounded bg-gray-100 relative"><div class="h-2 rounded absolute top-0 left-0" style="width:${actualMed}%;background:${actualMed>tMed+10?'#f1b657':actualMed<tMed-10?'#ef786f':'#47bca4'}"></div><div class="absolute top-0 h-2 w-0.5 bg-ink" style="left:${tMed}%"></div></div><p class="text-[11px] muted mt-1">${actualMed>tMed+10?'↑ Đang thừa '+(actualMed-tMed)+'% — cân nhắc đa dạng hóa':actualMed<tMed-10?'↓ Đang thiếu '+(tMed-actualMed)+'% — xem xét bổ sung quỹ/trái phiếu/BĐS':'✓ Phù hợp với hồ sơ rủi ro'}</p></div><div><div class="flex justify-between text-xs mb-1"><span>Tăng trưởng cao (cổ phiếu, crypto)</span><span><b>${actualGrowth}%</b> thực tế vs <b>${tGrowth}%</b> khuyến nghị</span></div><div class="h-2 rounded bg-gray-100 relative"><div class="h-2 rounded absolute top-0 left-0" style="width:${actualGrowth}%;background:${actualGrowth>tGrowth+10?'#ef786f':actualGrowth<tGrowth-10?'#f1b657':'#47bca4'}"></div><div class="absolute top-0 h-2 w-0.5 bg-ink" style="left:${tGrowth}%"></div></div><p class="text-[11px] muted mt-1">${actualGrowth>tGrowth+10?'⚠ Vượt '+(actualGrowth-tGrowth)+'% — rủi ro cao hơn mức bạn thoải mái chịu đựng':actualGrowth<tGrowth-10?'↓ Còn dư địa '+(tGrowth-actualGrowth)+'% để tăng trưởng nếu phù hợp mục tiêu':'✓ Phù hợp với hồ sơ rủi ro'}</p></div></div></div>`;
 }

 return header('Tổng quan gia sản','Bức tranh tài chính của bạn, rõ ràng và dễ hành động.')+`<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-5">${metric('TỔNG TÀI SẢN',compact(a.t.assets),'Giá trị bạn đang sở hữu')}${metric('TỔNG KHOẢN NỢ',compact(a.t.debts),a.debtRatio>0.5?'Cần ưu tiên kiểm soát':'Trong vùng an toàn',a.debtRatio>0.5?'border-coral':'')}${metric('GIÁ TRỊ RÒNG',compact(a.t.net),'Tài sản trừ đi các khoản nợ')}${metric('DÒNG TIỀN RÒNG / THÁNG',compact(a.savings),a.savings>=0?'Đang tích lũy':'Đang thâm hụt',a.savings<0?'border-coral':'')}</div><div class="grid lg:grid-cols-3 gap-5"><div class="card p-5 lg:col-span-2"><div class="flex justify-between items-center mb-3"><div><h2 class="font-extrabold">Sức khỏe tài chính</h2><p class="muted text-xs mt-1">Các chỉ số quan trọng theo dữ liệu hiện tại</p></div><span class="tag ${a.savings>=0?'good':'bad'}">${a.savings>=0?'Ổn định':'Cần điều chỉnh'}</span></div><div class="grid md:grid-cols-2 gap-5 mt-5"><div><div class="flex justify-between text-xs mb-2"><span>Tỷ lệ nợ / tài sản</span><b>${pct(sum(data.debts),a.t.assets)}%</b></div><div class="bar ${a.debtRatio>.5?'red':a.debtRatio>.3?'orange':''}"><span style="width:${Math.min(100,pct(sum(data.debts),a.t.assets))}%"></span></div><p class="muted text-[11px] mt-2">Mục tiêu khuyến nghị: dưới 30%</p></div><div><div class="flex justify-between text-xs mb-2"><span>Quỹ dự phòng</span><b>${ef.months.toFixed(1)} tháng</b></div><div class="bar ${ef.months<3?'orange':''}"><span style="width:${Math.min(100,ef.months/6*100)}%"></span></div><p class="muted text-[11px] mt-2">Mục tiêu: 3–6 tháng chi phí</p></div></div>${efExplain}<div class="mt-6" style="height:210px"><canvas id="cashChart"></canvas></div></div><div class="card p-5"><h2 class="font-extrabold">Phân bổ tài sản</h2><p class="muted text-xs mt-1">Theo nhóm tài sản</p><div style="height:220px" class="mt-3"><canvas id="allocationChart"></canvas></div>${allocation.length?allocation.map(x=>`<div class="flex justify-between text-xs mt-3"><span><i class="inline-block w-2 h-2 rounded-full mr-2" style="background:${x[2]}"></i>${x[0]}</span><b>${compact(x[1])}</b></div>`).join(''):'<p class="muted text-sm mt-6 text-center">Hãy nhập tài sản để xem phân bổ.</p>'}</div></div>${riskCompare}<div class="card p-5 mt-5"><div class="flex justify-between items-center"><div><h2 class="font-extrabold">Việc nên làm tiếp theo</h2><p class="muted text-xs mt-1">Gợi ý cụ thể từ dữ liệu gia sản của bạn</p></div><button onclick="go(5)" class="btn btn-ghost text-xs">Xem phân tích đầy đủ</button></div><div class="grid md:grid-cols-3 gap-3 mt-5">${quickActions(a)}</div></div>`}

function quickActions(a){
 let actions=[];
 let ef=a.ef;
 if(ef.months<3){
  let need=compact(ef.shortfall);
  actions.push(`<div class="bg-slate-50 rounded-xl p-4"><div class="text-coral text-lg font-bold">!</div><b class="text-sm">Bổ sung quỹ dự phòng</b><p class="muted text-xs mt-1">Cần thêm ${need}. Ưu tiên chuyển từ Vàng/Ngoại tệ hoặc dùng dòng tiền ròng hàng tháng.</p></div>`);
 }
 let qr=quizResult();
 if(qr && a.ab.investable>0){
  let actualGrowth=Math.round(a.ab.growth/a.ab.investable*100);
  let tGrowth=qr.alloc[2];
  if(actualGrowth>tGrowth+10){
   let excess=compact(a.ab.growth-a.ab.investable*tGrowth/100);
   actions.push(`<div class="bg-slate-50 rounded-xl p-4"><div class="text-coral text-lg font-bold">⚠</div><b class="text-sm">Giảm tài sản rủi ro cao</b><p class="muted text-xs mt-1">Cổ phiếu+Crypto vượt ${actualGrowth-tGrowth}% so với hồ sơ. Cân nhắc chuyển ~${excess} sang quỹ/trái phiếu.</p></div>`);
  } else if(actualGrowth<tGrowth-10){
   actions.push(`<div class="bg-slate-50 rounded-xl p-4"><div class="text-teal-700 text-lg">↑</div><b class="text-sm">Tăng tỷ trọng tăng trưởng</b><p class="muted text-xs mt-1">Hồ sơ "${qr.label}" cho phép ${tGrowth}% tăng trưởng cao, hiện chỉ ${actualGrowth}%. Có thể phân bổ thêm.</p></div>`);
  }
 }
 if(a.debtRatio>.3){
  actions.push(`<div class="bg-slate-50 rounded-xl p-4"><div class="text-coral text-lg font-bold">!</div><b class="text-sm">Ưu tiên giảm nợ</b><p class="muted text-xs mt-1">Nợ chiếm ${pct(sum(data.debts),a.t.assets)}% tài sản. Trả nợ lãi cao trước (thẻ tín dụng, vay app).</p></div>`);
 }
 if(actions.length===0){
  actions.push(`<div class="bg-slate-50 rounded-xl p-4"><div class="text-teal-700 text-lg">✓</div><b class="text-sm">Duy trì kỷ luật</b><p class="muted text-xs mt-1">Tình hình tài chính ổn. Tiếp tục tích lũy và rà soát hàng tháng.</p></div>`);
 }
 if(a.ab.receivable>0){
  actions.push(`<div class="bg-slate-50 rounded-xl p-4"><div class="text-purple-600 text-lg">⟐</div><b class="text-sm">Theo dõi nợ phải đòi</b><p class="muted text-xs mt-1">Bạn đang cho mượn ${compact(a.ab.receivable)}. Đây là tài sản kém thanh khoản, cân nhắc thu hồi nếu cần.</p></div>`);
 }
 return actions.join('');
}

function quizUI(){
 let answered=data.profile.quizAnswers.filter(x=>x>=0).length;

 if(score!==null){

  return `<div class="border-t mt-6 pt-6"><div class="section-title mb-3">BÀI ĐÁNH GIÁ KHẢ NĂNG CHỊU RỦI RO TÀI CHÍNH</div><p class="text-xs muted mb-2">Dựa trên thang đo Grable & Lytton (13 câu hỏi) — được sử dụng rộng rãi trong ngành tài chính cá nhân.</p><div class="card p-5 mt-4" style="border-left:4px solid ${cat.color}"><div class="flex justify-between items-center"><div><div class="text-xs muted font-bold">KẾT QUẢ CỦA BẠN</div><div class="text-2xl font-extrabold mt-1" style="color:${cat.color}">${cat.label}</div><div class="text-sm muted mt-1">${score}/47 điểm</div></div><div class="text-right"><div class="w-16 h-16 rounded-full grid place-items-center text-white font-extrabold text-lg" style="background:${cat.color}">${score}</div></div></div><p class="text-sm mt-4 leading-6">${cat.desc}</p><p class="text-sm mt-2"><b>Phân bổ tài sản khuyến nghị:</b> ${cat.allocText}</p></div><button onclick="data.profile.quizAnswers=Array(13).fill(-1);data.profile.quizScore=null;quizPage=0;localStorage.setItem('wealthOSData',JSON.stringify(data));render()" class="btn btn-ghost text-xs mt-4">Làm lại bài test</button></div>`;
 }
 let perPage=3;
 let totalPages=Math.ceil(13/perPage);
 let startQ=quizPage*perPage;
 let endQ=Math.min(startQ+perPage,13);
 let html=`<div class="border-t mt-6 pt-6"><div class="section-title mb-3">BÀI ĐÁNH GIÁ KHẢ NĂNG CHỊU RỦI RO TÀI CHÍNH</div><p class="text-xs muted mb-1">Dựa trên thang đo Grable & Lytton (13 câu hỏi) — công cụ đánh giá rủi ro tài chính được sử dụng rộng rãi bởi các chuyên gia hoạch định tài chính.</p><p class="text-xs muted mb-4">Trả lời tất cả 13 câu để nhận kết quả. Đã trả lời: <b>${answered}/13</b></p>`;
 html+=`<div class="quiz-progress"><span style="width:${pct(answered,13)}%"></span></div>`;
 for(let i=startQ;i<endQ;i++){
  let qq=quizQuestions[i];
  html+=`<div class="mb-6"><div class="font-bold text-sm mb-3"><span class="text-teal-700">Câu ${i+1}.</span> ${qq.q}</div>`;
  qq.opts.forEach((opt,oi)=>{
   let sel=data.profile.quizAnswers[i]===oi;
   html+=`<div class="quiz-option ${sel?'selected':''}" onclick="selectQuizAnswer(${i},${oi})"><input type="radio" name="q${i}" ${sel?'checked':''} /><span class="text-sm">${opt}</span></div>`;
  });
  html+=`</div>`;
 }
 html+=`<div class="flex justify-between items-center mt-4">`;
 if(quizPage>0) html+=`<button onclick="quizPage--;render()" class="btn btn-ghost">← Trang trước</button>`; else html+=`<div></div>`;
 if(quizPage<totalPages-1) html+=`<button onclick="quizPage++;render()" class="btn btn-primary">Trang tiếp →</button>`;
 else html+=`<button onclick="finishQuiz()" class="btn btn-primary" ${answered<13?'disabled style="opacity:0.5"':''}>Xem kết quả ✓</button>`;
 html+=`</div></div>`;
 return html;
}

// ===== INSIGHTS - Deep analysis =====
function insights(){
 let a=analysis(),goalYears=Math.max(1,data.profile.targetAge-data.profile.age),goalText=data.profile.goal||'mục tiêu của bạn';
 let qr=quizResult();
 let ef=a.ef;
 let tips=[];

 // 1. Emergency fund - specific
 if(ef.months<1){
  tips.push({title:'Quỹ dự phòng nguy hiểm',desc:`Bạn chỉ có ${compact(ef.fund)} thanh khoản cao (= ${ef.months.toFixed(1)} tháng chi tiêu). Nếu mất thu nhập, bạn sẽ gặp khó khăn ngay lập tức.`,action:`<b>Hành động:</b> Chuyển ngay ${compact(Math.min(ef.shortfall, (Number(data.assets.gold)||0)+(Number(data.assets.fx)||0)))} từ Vàng/Ngoại tệ sang Tiền gửi ngân hàng. Đồng thời dành ${compact(Math.min(a.savings>0?a.savings:0, ef.shortfall))} từ dòng tiền ròng mỗi tháng cho đến khi đạt ${compact(ef.monthlyExpense*3)}.`,level:'bad'});
 } else if(ef.months<3){
  tips.push({title:'Quỹ dự phòng chưa đủ',desc:`Quỹ dự phòng = ${compact(ef.fund)} (Tiền mặt + TG ngân hàng + Tiết kiệm) = ${ef.months.toFixed(1)} tháng chi tiêu. Mức an toàn tối thiểu là 3 tháng.`,action:`<b>Hành động:</b> Cần bổ sung thêm ${compact(ef.shortfall)}. ${(Number(data.assets.gold)||0)>0?'Cân nhắc chuyển một phần Vàng ('+compact(Math.min(Number(data.assets.gold),ef.shortfall))+') sang tiền gửi ngắn hạn.':'Dùng dòng tiền ròng '+compact(a.savings>0?a.savings:0)+'/tháng để tích lũy.'} Mục tiêu: đạt ${compact(ef.monthlyExpense*3)} trong quỹ thanh khoản.`,level:'warn'});
 } else if(ef.months<6){
  tips.push({title:'Quỹ dự phòng tạm ổn',desc:`Quỹ dự phòng = ${compact(ef.fund)} = ${ef.months.toFixed(1)} tháng chi tiêu. Đã đạt mức tối thiểu 3 tháng nhưng chưa đạt lý tưởng 6 tháng.`,action:`<b>Gợi ý:</b> Tiếp tục tích lũy thêm ${compact(ef.monthlyExpense*6-ef.fund)} để đạt 6 tháng. Sau đó ưu tiên phân bổ sang đầu tư dài hạn.`,level:'good'});
 } else {
  tips.push({title:'Quỹ dự phòng vượt mức',desc:`Quỹ dự phòng = ${compact(ef.fund)} = ${ef.months.toFixed(1)} tháng chi tiêu. Vượt mức 6 tháng khuyến nghị.`,action:`<b>Gợi ý:</b> Phần vượt (${compact(ef.fund-ef.monthlyExpense*6)}) có thể chuyển sang tài sản sinh lời cao hơn: quỹ mở, trái phiếu, hoặc cổ phiếu tùy hồ sơ rủi ro.`,level:'good'});
 }

 // 2. Debt analysis - specific
 let consumerDebt=(Number(data.debts.cardDebt)||0)+(Number(data.debts.installment)||0)+(Number(data.debts.appLoan)||0)+(Number(data.debts.financeLoan)||0);
 let securedDebt=(Number(data.debts.homeLoan)||0)+(Number(data.debts.carLoan)||0)+(Number(data.debts.businessLoan)||0);
 let totalDebt=sum(data.debts);
 
 if(consumerDebt>0 && consumerDebt>a.t.income*2){
  tips.push({title:'Nợ tiêu dùng lãi cao đáng báo động',desc:`Nợ tiêu dùng (thẻ tín dụng, trả góp, vay app, tín chấp) = ${compact(consumerDebt)}, gấp ${(consumerDebt/Math.max(a.t.income,1)).toFixed(1)}x thu nhập tháng. Đây là nhóm nợ lãi suất cao nhất (18-50%/năm).`,action:`<b>Hành động ngay:</b> 1) Trả hết dư nợ thẻ tín dụng (${compact(Number(data.debts.cardDebt)||0)}) trước — lãi cao nhất. 2) Tất toán vay app (${compact(Number(data.debts.appLoan)||0)}) — lãi ẩn rất cao. 3) Không vay mới cho đến khi tổng nợ tiêu dùng < 1 tháng thu nhập.`,level:'bad'});
 } else if(consumerDebt>0){
  tips.push({title:'Có nợ tiêu dùng cần theo dõi',desc:`Nợ tiêu dùng = ${compact(consumerDebt)} (${pct(consumerDebt,totalDebt)}% tổng nợ). Nhóm này thường có lãi suất 18-50%/năm.`,action:`<b>Gợi ý:</b> Ưu tiên trả dứt điểm theo thứ tự lãi suất: Vay app > Thẻ tín dụng > Tín chấp > Trả góp. Mỗi tháng dành tối thiểu ${compact(Math.min(a.savings>0?a.savings*0.5:0,consumerDebt))} để giảm nợ.`,level:'warn'});
 }
 
 if(a.debtRatio>.5){
  tips.push({title:'Tổng nợ vượt 50% tài sản',desc:`Tỷ lệ nợ/tài sản = ${pct(totalDebt,a.t.assets)}%. Mức an toàn khuyến nghị: dưới 30%. Bạn đang ở vùng rủi ro cao.`,action:`<b>Hành động:</b> Tạm dừng mọi khoản vay mới. Tập trung dòng tiền ròng (${compact(a.savings)}/tháng) vào trả nợ. Nếu có tài sản kém hiệu quả, cân nhắc thanh lý để giảm nợ.`,level:'bad'});
 }

 // 3. Risk profile vs actual allocation - detailed
 if(qr && a.ab.investable>0){
  let actualSafe=Math.round(a.ab.safe/a.ab.investable*100);
  let actualMed=Math.round(a.ab.medium/a.ab.investable*100);
  let actualGrowth=Math.round(a.ab.growth/a.ab.investable*100);
  let [tSafe,tMed,tGrowth]=qr.alloc;
  
  let mismatches=[];
  if(actualGrowth>tGrowth+10){
   let excessAmt=a.ab.growth-a.ab.investable*tGrowth/100;
   mismatches.push(`Cổ phiếu+Crypto chiếm ${actualGrowth}% (khuyến nghị ${tGrowth}%) — vượt ${actualGrowth-tGrowth}% = ${compact(excessAmt)}. Rủi ro: nếu thị trường giảm 30-50%, bạn có thể mất ${compact(excessAmt*0.4)} — vượt ngưỡng chịu đựng của hồ sơ "${qr.label}".`);
  }
  if(actualSafe<tSafe-10){
   mismatches.push(`Tài sản an toàn chỉ ${actualSafe}% (khuyến nghị ${tSafe}%) — thiếu ${tSafe-actualSafe}% = ${compact(a.ab.investable*(tSafe-actualSafe)/100)}. Bạn đang chịu rủi ro cao hơn mức thoải mái.`);
  }
  if(actualMed<tMed-10){
   mismatches.push(`Nhóm trung bình (quỹ, trái phiếu, BĐS) chỉ ${actualMed}% (khuyến nghị ${tMed}%). Cân nhắc bổ sung quỹ cân bằng hoặc trái phiếu doanh nghiệp.`);
  }
  if(actualSafe>tSafe+15 && (qr.label==='Năng động'||qr.label==='Mạo hiểm'||qr.label==='Cân bằng')){
   mismatches.push(`Tài sản an toàn chiếm ${actualSafe}% (khuyến nghị ${tSafe}%) — thừa ${actualSafe-tSafe}% = ${compact(a.ab.investable*(actualSafe-tSafe)/100)}. Với hồ sơ "${qr.label}" và ${goalYears} năm trước mục tiêu, bạn có thể chuyển phần thừa sang nhóm tăng trưởng để đạt lợi nhuận cao hơn.`);
  }
  
  if(mismatches.length>0){
   tips.push({title:`Phân bổ chưa khớp hồ sơ "${qr.label}"`,desc:`So sánh thực tế vs khuyến nghị: An toàn ${actualSafe}% vs ${tSafe}% | Trung bình ${actualMed}% vs ${tMed}% | Tăng trưởng ${actualGrowth}% vs ${tGrowth}%.`,action:`<b>Chi tiết:</b><br>• ${mismatches.join('<br>• ')}<br><br><b>Đề xuất điều chỉnh:</b> Chuyển dần (không cần làm ngay) theo tỷ lệ khuyến nghị ${qr.allocText}. Ưu tiên dùng dòng tiền mới thay vì bán tài sản hiện có.`,level:'warn'});
  } else {
   tips.push({title:`Phân bổ phù hợp hồ sơ "${qr.label}"`,desc:`Thực tế: An toàn ${actualSafe}% | Trung bình ${actualMed}% | Tăng trưởng ${actualGrowth}%. Sai lệch nằm trong biên độ chấp nhận được (±10%).`,action:`<b>Gợi ý:</b> Duy trì tỷ lệ hiện tại. Khi có dòng tiền mới, phân bổ theo ${qr.allocText} để giữ cân bằng.`,level:'good'});
  }
 }

 // 4. Cashflow analysis
 if(a.savings<0){
  tips.push({title:'Dòng tiền âm — đang tiêu nhiều hơn kiếm',desc:`Thu nhập TB: ${compact(a.t.income)}/tháng. Chi tiêu TB: ${compact(a.t.expense)}/tháng. Thâm hụt: ${compact(Math.abs(a.savings))}/tháng.`,action:`<b>Hành động:</b> 1) Rà soát chi tiêu — cắt giảm các khoản không thiết yếu. 2) Nếu không cắt được, cần tăng thu nhập. 3) KHÔNG vay nợ mới để bù thâm hụt. Nếu kéo dài, tài sản sẽ giảm ${compact(Math.abs(a.savings)*12)}/năm.`,level:'bad'});
 } else if(a.savings>0 && a.t.income>0 && a.savings/a.t.income<0.2){
  tips.push({title:'Tỷ lệ tiết kiệm thấp',desc:`Bạn chỉ tiết kiệm được ${pct(a.savings,a.t.income)}% thu nhập (${compact(a.savings)}/tháng). Mức khuyến nghị: tối thiểu 20%.`,action:`<b>Gợi ý:</b> Cần tiết kiệm thêm ${compact(a.t.income*0.2-a.savings)}/tháng để đạt 20%. Áp dụng quy tắc "trả cho mình trước" — tự động chuyển khoản tiết kiệm ngay khi nhận lương.`,level:'warn'});
 }

 // 5. Receivables warning
 if(a.ab.receivable>0 && a.ab.receivable>a.t.assets*0.1){
  tips.push({title:'Nợ phải đòi chiếm tỷ trọng đáng kể',desc:`Bạn đang cho mượn ${compact(a.ab.receivable)} (${pct(a.ab.receivable,a.t.assets)}% tổng tài sản). Đây là tài sản không sinh lời và có rủi ro mất vốn.`,action:`<b>Lưu ý:</b> Nợ phải đòi không tạo ra lợi nhuận và khó thu hồi nếu kéo dài. Cân nhắc: 1) Đặt thời hạn thu hồi rõ ràng. 2) Không cho mượn thêm nếu chưa thu hồi khoản cũ. 3) Nếu cần quỹ dự phòng, ưu tiên đòi lại trước.`,level:'warn'});
 }

 // 6. Goal timeline
 if(goalYears<=5 && a.ab.growth>a.ab.investable*0.4){
  tips.push({title:'Mục tiêu gần nhưng tài sản biến động cao',desc:`Bạn muốn đạt "${goalText}" trong ${goalYears} năm, nhưng ${pct(a.ab.growth,a.ab.investable)}% tài sản đầu tư nằm ở nhóm biến động cao (cổ phiếu, crypto).`,action:`<b>Cảnh báo:</b> Với thời hạn ngắn, nếu thị trường giảm mạnh bạn có thể không kịp hồi phục. Nên chuyển dần sang tài sản ổn định hơn (quỹ trái phiếu, tiết kiệm) khi càng gần mục tiêu.`,level:'warn'});
 }

 return header('Phân tích & Chiến lược','Đánh giá chi tiết dựa trên dữ liệu gia sản thực tế của bạn.')+`<div class="grid md:grid-cols-3 gap-4 mb-5">${metric('MỤC TIÊU',goalText,`${goalYears} năm để chuẩn bị`)}${metric('TỶ LỆ TIẾT KIỆM',pct(a.savings,a.t.income)+'%',a.savings>=0?'Dòng tiền dương — '+compact(a.savings)+'/tháng':'Dòng tiền âm',a.savings<0?'border-coral':'')}${metric('HỒ SƠ RỦI RO',qr?qr.label:'Chưa làm test',qr?data.profile.quizScore+'/47 điểm — '+qr.allocText:'Hoàn thành bài test 13 câu')}</div><div class="max-w-4xl"><div class="text-xs font-bold muted mb-3 uppercase tracking-wider">Phân tích chi tiết & Hành động cụ thể (${tips.length} mục)</div>${tips.map(t=>`<div class="advice-card ${t.level==='bad'?'danger':t.level==='warn'?'warning':''}"><div class="flex gap-3 items-start"><span class="tag ${t.level} h-fit mt-0.5">${t.level==='good'?'TỐT':t.level==='warn'?'LƯU Ý':'KHẨN CẤP'}</span><div class="flex-1"><b class="text-sm">${t.title}</b><p class="text-xs muted mt-1 leading-5">${t.desc}</p><div class="text-xs mt-3 leading-5 p-3 rounded-lg" style="background:rgba(0,0,0,.02)">${t.action}</div></div></div></div>`).join('')}</div>`;
}

function renderCharts(){let a=analysis();if(step===0){chart('cashChart','bar',['Thu nhập','Chi tiêu','Dòng tiền ròng'],[a.t.income,a.t.expense,Math.max(0,a.savings)],['#47bca4','#ef786f','#6f91e8']);let vals=assetGroups.map(g=>g.items.reduce((s,x)=>s+(Number(data.assets[x[0]])||0),0));chart('allocationChart','doughnut',assetGroups.map(g=>g.title),vals,assetGroups.map(g=>g.color))}}
function render(full=true){let content=step===0?dashboard():step===1?profile():step===2?cashflow():step===3?assets():step===4?debts():insights();document.getElementById('app').innerHTML=`<div class="app flex">${nav()}<main class="main ml-64 flex-1 p-5 md:p-9 max-w-[1500px]">${content}<div id="toast" class="hidden fixed bottom-6 right-6 bg-ink text-white px-4 py-3 rounded-xl text-sm shadow-xl">Đã lưu</div></main></div>`;setTimeout(renderCharts,30)}
function go(i){step=i;render()}function resetData(){if(confirm('Xóa toàn bộ dữ liệu đã lưu?')){localStorage.removeItem('wealthOSData');location.reload()}}
render();
</script>
